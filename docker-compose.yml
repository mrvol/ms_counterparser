services:
  counterparser:
    # Pulled from GHCR by default (built by .github/workflows/docker.yml on every push to
    # main). `build: .` is still here so `docker compose build` works for local dev/testing
    # without needing a registry round-trip.
    image: ghcr.io/mrvol/ms_counterparser:latest
    build: .
    restart: unless-stopped
    environment:
      COUNTERPARSER_CONFIG: /etc/counterparser/config.toml
      COUNTERPARSER_HMAC_SECRET: ${COUNTERPARSER_HMAC_SECRET:?set COUNTERPARSER_HMAC_SECRET in .env}
      RUST_LOG: info
    volumes:
      - ./config.toml:/etc/counterparser/config.toml:ro
      - /srv/counterparser/run:/run/counterparser
    healthcheck:
      test: ["CMD", "test", "-S", "/run/counterparser/counterparser.sock"]
      interval: 10s
      timeout: 3s
      retries: 3
