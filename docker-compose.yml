services:
  counterparser:
    # Built by .github/workflows/docker.yml on every push to main and pulled from GHCR.
    image: ghcr.io/mrvol/ms_counterparser:latest
    restart: unless-stopped
    environment:
      COUNTERPARSER_CONFIG: /run/counterparser/config.toml
      COUNTERPARSER_HMAC_SECRET: ${COUNTERPARSER_HMAC_SECRET:?set COUNTERPARSER_HMAC_SECRET in .env}
      RUST_LOG: info
    volumes:
      # Everything shared between host and container — config.toml, the socket — lives in one
      # bind-mounted directory. create_host_path: false: if ./run doesn't exist yet on the
      # host, compose fails loudly instead of silently mounting an empty directory in its place.
      - type: bind
        source: ./run
        target: /run/counterparser
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "test", "-S", "/run/counterparser/counterparser.sock"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
